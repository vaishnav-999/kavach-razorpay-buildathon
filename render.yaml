# Render Blueprint — Kavach (BUILD_SPEC §19.2)
#
# A Docker web service plus a free Postgres, both in region singapore, with
# every environment variable from §4.1 declared. Secrets are `sync: false`:
# Render prompts for them at blueprint apply time and never stores them here.
#
# Deploy:  Render dashboard → New → Blueprint → point at this repo.
# After the first deploy, set APP_BASE_URL to the assigned https:// URL and
# register the webhook at <APP_BASE_URL>/api/webhooks/razorpay (§19.3).

databases:
  - name: kavach-db
    databaseName: kavach
    user: kavach
    region: singapore
    plan: free

services:
  - type: web
    name: kavach
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # ── Core ────────────────────────────────────────────────────────────
      # Render emits a postgres:// URL; config.py rewrites it to
      # postgresql:// for SQLAlchemy 2.x (§4.2).
      - key: DATABASE_URL
        fromDatabase:
          name: kavach-db
          property: connectionString
      # Not a secret, but deploy-specific: set to the service's own
      # https://<name>.onrender.com URL once Render has assigned it.
      - key: APP_BASE_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO

      # ── Razorpay (TEST MODE ONLY) ───────────────────────────────────────
      # RAZORPAY_KEY_ID must begin rzp_test_ — the app refuses to start
      # on a live key (§4.2).
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Must match the secret configured on the Razorpay dashboard webhook.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Signing seeds — 64 hex chars each, and different from each other ─
      #    python3 -c "import os;print(os.urandom(32).hex())"
      - key: MANDATE_SIGNING_SEED
        sync: false
      - key: MERCHANT_SIGNING_SEED
        sync: false

      # ── Merchant plane auth ─────────────────────────────────────────────
      - key: MERCHANT_API_KEY
        sync: false

      # ── LLM provider: gemini | anthropic | cassette ──────────────────────
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # Pick the newest Flash model still showing a free tier on the day you
      # deploy — see https://ai.google.dev/gemini-api/docs/models.
      - key: GEMINI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

      # ── Cassette record/replay (§11.8) ───────────────────────────────────
      - key: CASSETTE_MODE
        value: "off"
      - key: CASSETTE_DIR
        value: cassettes
